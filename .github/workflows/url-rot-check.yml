name: URL rot check
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check external URLs in README and prompts
        run: python3 scripts/check-external-links.py
