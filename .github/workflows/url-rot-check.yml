name: URL rot check
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check external URLs in README and prompts
        run: python3 scripts/check-external-links.py
