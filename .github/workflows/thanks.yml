name: Thank contributors
on:
  pull_request_target:
    types: [closed]
permissions:
  issues: write
  pull-requests: read

jobs:
  thank:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Thank first-time contributors
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const login = context.payload.pull_request.user.login;
            const query = `is:pr author:${login} repo:${owner}/${repo} is:merged`;
            let count = 0;
            let page = 1;
            const perPage = 100;
            while (true) {
              const result = await github.rest.search.issuesAndPullRequests({ q: query, per_page: perPage, page });
              count += result.data.items.length;
              if (result.data.items.length < perPage) break;
              page += 1;
            }
            if (count === 1) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body: "First merge landed. Welcome to awesome-ai-prompts! Your name is now in CONTRIBUTORS.md automatically, and your avatar shows up on the README. Star the repo and take a good first issue for a second one - or say the word and we will remove your listing.\n\nThanks for the work, it is appreciated. \u2B50"
              });
            }
