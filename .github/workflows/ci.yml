name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Markdown lint
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npx --yes markdownlint-cli2@0.17.2 "**/*.md"
      - name: Docs lint (README links + prompt conventions)
        run: bash scripts/check-links.sh
      - name: No em dashes
        run: |
          EM="$(python3 -c 'print("\u2014")')"
          if git grep -I -l "$EM" ; then
            echo "Em dashes are not allowed in this repo. Use an ASCII hyphen (-) instead."
            exit 1
          fi
          echo "No em dashes found."
      - name: Shellcheck scripts
        run: |
          mapfile -t FILES < <(git ls-files '*.sh')
          if [ ${#FILES[@]} -gt 0 ]; then
            sudo apt-get update && sudo apt-get install -y shellcheck
            shellcheck "${FILES[@]}"
          fi
