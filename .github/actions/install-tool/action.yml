name: Install pinned tool

description: >-
  Install a tool version pinned in ci.yml, either from a release tarball
  (download, extract under RUNNER_TEMP, install the binary to /usr/local/bin
  via url/dest/source) or from PyPI (pypi="pkg==ver"). Keeps the install step
  for every pinned CLI in ci.yml (typos, ec, actionlint, gitleaks, ruff,
  zizmor, cffconvert) in one place so the jobs cannot silently diverge in how
  they install tools.

inputs:
  url:
    description: Tarball URL to download.
    required: false
  dest:
    description: Subdirectory of RUNNER_TEMP to extract the tarball into.
    required: false
  source:
    description: Path of the executable to install, relative to dest.
    required: false
  target:
    description: Name to install the binary as. Defaults to the source basename.
    required: false
    default: ""
  pypi:
    description: Pip-install a pinned Python package instead, e.g. "ruff==0.16.4".
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${{ inputs.pypi }}" ]; then
          python3 -m pip install --quiet --break-system-packages "${{ inputs.pypi }}"
          exit 0
        fi
        if [ -z "${{ inputs.url }}" ] || [ -z "${{ inputs.dest }}" ] || [ -z "${{ inputs.source }}" ]; then
          echo "tarball mode requires url, dest, and source inputs (or pass pypi=\"pkg==ver\")" >&2
          exit 1
        fi
        site="$RUNNER_TEMP/${{ inputs.dest }}"
        target="${{ inputs.target }}"
        target="${target:-$(basename "${{ inputs.source }}")}"
        mkdir -p "$site"
        curl -sSL "${{ inputs.url }}" | tar -xz -C "$site"
        test -x "$site/${{ inputs.source }}" || {
          echo "binary not found at $site/${{ inputs.source }} - tarball layout may have changed" >&2
          exit 1
        }
        sudo install -m 0755 "$site/${{ inputs.source }}" "/usr/local/bin/$target"
